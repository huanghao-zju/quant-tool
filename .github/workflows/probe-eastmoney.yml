name: probe-eastmoney

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"   # 临时探测用

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe egress location
        run: |
          echo "=== runner IP ==="
          curl -s -m 15 http://ip-api.com/json/?fields=country,countryCode,isp,query || echo "ip-api failed"
          echo
          echo "=== Eastmoney datacenter-web (spot) ==="
          curl -s -m 20 -o /tmp/spot.json -w "HTTP:%{http_code} time:%{time_total}s\n" \
            "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_DMSK_TS_STOCKNEW&columns=SECURITY_CODE,SECURITY_NAME_ABBR,CLOSE_PRICE,PE_DYNAMIC&pageSize=3&pageNumber=1&sortColumns=SECURITY_CODE&sortTypes=1"
          head -c 500 /tmp/spot.json
          echo
          echo "=== Eastmoney financials (RPT_LICO_FN_CPD) ==="
          curl -s -m 20 -o /tmp/fin.json -w "HTTP:%{http_code} time:%{time_total}s\n" \
            "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_LICO_FN_CPD&columns=SECURITY_CODE,REPORTDATE,YSTZ&pageSize=3&pageNumber=1&filter=(REPORTDATE%3D%272026-09-30%27)"
          head -c 400 /tmp/fin.json
          echo
          echo "=== push2 (akshare primary) ==="
          curl -s -m 20 -o /dev/null -w "HTTP:%{http_code}\n" \
            "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&fs=m:0+t:6&fields=f12,f14,f2" || echo "push2 failed"

      - name: Probe akshare install + full pipeline
        run: |
          python3 -V
          pip install --quiet --upgrade pip
          pip install --quiet "akshare>=1.14" "pandas>=2.0" "PyYAML>=6.0"
          python3 -c "import akshare,pandas,yaml;print('akshare',akshare.__version__,'pandas',pandas.__version__)"
          cd ashare_screener
          echo "=== run screener update (fresh DB) ==="
          timeout 600 python3 -m screener update 2>&1 | tail -8
          echo "=== status ==="
          python3 -m screener status
          echo "=== screen ==="
          timeout 300 python3 -m screener screen -o out_daily.csv 2>&1 | head -8
          echo "=== csv rows ==="
          wc -l out_daily.csv

      - name: Summary
        if: always()
        run: |
          {
            echo "### 探测结果"
            echo ""
            echo "- Eastmoney 可达: 见上"
            echo "- akshare 全量 update: 见上"
            echo "- 结论: $( [ -s out_daily.csv ] && echo '云端全链路可用' || echo '云端链路有问题' )"
          } >> "$GITHUB_STEP_SUMMARY"
